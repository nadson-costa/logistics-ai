services:
  db:
    image: postgres:15-alpine
    container_name: logistics_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.15.1
    container_name: logistics_mlflow
    hostname: mlflow
    ports:
      - target: 5000
        published: 5005
        protocol: tcp
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
    volumes:
      - mlflow_data:/mlflow

  api:
    build: .
    container_name: logistics_api
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NOTIFICATION_EMAIL_FROM=${NOTIFICATION_EMAIL_FROM}
      - NOTIFICATION_EMAIL_TO=${NOTIFICATION_EMAIL_TO}
      - NOTIFICATION_WINDOW_SECONDS=${NOTIFICATION_WINDOW_SECONDS}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_SENDER=${TWILIO_SENDER}
      - TWILIO_RECIPIENT=${TWILIO_RECIPIENT}
    depends_on:
      - mlflow
      - db

volumes:
  pgdata:
  mlflow_data: